<script>/* Local-only workspace adapter. Replace this adapter with authenticated Supabase
   operations; the local role checks are UX guards, never a security boundary. */
const WorkspaceStore = (() => {
  const key = 'backendos.workspaces.v1';
  const user = Object.freeze({id:'prototype-user',name:'You (prototype)',prototype:true});
  const appIds = ['reservations','customers','tax-tracker','documents'];
  const clone = value => structuredClone(value);
  const id = () => crypto.randomUUID();
  const timestamp = () => new Date().toISOString();
  let persistenceError = false;
  let state;
  const seed = visible => {
    const workspaceId = id();
    return {version:1,activeWorkspaceId:workspaceId,workspaces:[{id:workspaceId,name:'My workspace',business:{email:'',phone:'',address:''},enabledApps:[...appIds],createdAt:timestamp(),example:false}],members:[{workspaceId,userId:user.id,name:user.name,role:'owner'}],homes:[{workspaceId,userId:user.id,shortcuts:visible}],invitationDrafts:[]};
  };
  function persist(){try{localStorage.setItem(key,JSON.stringify(state));persistenceError=false;return true}catch{persistenceError=true;return false}}
  function initialize(legacyVisible){
    try{state=JSON.parse(localStorage.getItem(key)||'null')}catch{state=null}
    if(!state || state.version!==1 || !Array.isArray(state.workspaces) || !Array.isArray(state.members) || !Array.isArray(state.homes) || !Array.isArray(state.invitationDrafts) || !state.workspaces.length){state=seed(legacyVisible);persist()}
    const available=list();
    if(!available.length){state=seed(legacyVisible);persist()}
    else if(!available.some(w=>w.id===state.activeWorkspaceId)){state.activeWorkspaceId=available[0].id;persist()}
  }
  function list(){return clone(state.workspaces.filter(w=>state.members.some(m=>m.workspaceId===w.id&&m.userId===user.id)))}
  function active(){return clone(state.workspaces.find(w=>w.id===state.activeWorkspaceId))}
  function role(workspaceId=state.activeWorkspaceId){return state.members.find(m=>m.workspaceId===workspaceId&&m.userId===user.id)?.role||null}
  function requireOwner(){if(role()!=='owner')throw Error('Only the workspace owner can make this change.')}
  function shortcuts(){return clone(state.homes.find(h=>h.workspaceId===state.activeWorkspaceId&&h.userId===user.id)?.shortcuts||[])}
  function setShortcuts(shortcuts){let row=state.homes.find(h=>h.workspaceId===state.activeWorkspaceId&&h.userId===user.id);if(!row){row={workspaceId:state.activeWorkspaceId,userId:user.id,shortcuts:[]};state.homes.push(row)}row.shortcuts=[...new Set(shortcuts)].filter(v=>appIds.includes(v));persist()}
  function switchTo(workspaceId){if(!list().some(w=>w.id===workspaceId))throw Error('This workspace is not available.');state.activeWorkspaceId=workspaceId;persist();return active()}
  function validateName(name){name=String(name).trim();if(!name||name.length>80)throw Error('Use a workspace name between 1 and 80 characters.');return name}
  function create(name){name=validateName(name);const workspaceId=id();state.workspaces.push({id:workspaceId,name,business:{email:'',phone:'',address:''},enabledApps:[...appIds],createdAt:timestamp(),example:false});state.members.push({workspaceId,userId:user.id,name:user.name,role:'owner'});state.homes.push({workspaceId,userId:user.id,shortcuts:[...appIds]});persist();return workspaceId}
  function updateBusiness(values){requireOwner();const name=validateName(values.name);const email=String(values.email||'').trim();if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Enter a valid business email.');if(email.length>254||String(values.phone||'').length>40||String(values.address||'').length>300)throw Error('Business information is too long.');const w=state.workspaces.find(w=>w.id===state.activeWorkspaceId);w.name=name;w.business={email,phone:String(values.phone||'').trim(),address:String(values.address||'').trim()};w.updatedAt=timestamp();persist()}
  function enableApp(appId,enabled){requireOwner();if(!appIds.includes(appId))throw Error('Unknown Mini App.');const w=state.workspaces.find(w=>w.id===state.activeWorkspaceId);w.enabledApps=enabled?[...new Set([...w.enabledApps,appId])]:w.enabledApps.filter(v=>v!==appId);persist()}
  function members(){return clone(state.members.filter(m=>m.workspaceId===state.activeWorkspaceId))}
  function drafts(){return clone(state.invitationDrafts.filter(d=>d.workspaceId===state.activeWorkspaceId))}
  function invitationDraft(email){requireOwner();email=String(email).trim().toLowerCase();if(email.length>254||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Enter a valid email address.');if(drafts().some(d=>d.email===email))throw Error('An invitation draft already exists for this email.');state.invitationDrafts.push({id:id(),workspaceId:state.activeWorkspaceId,email,role:'member',status:'draft',createdAt:timestamp()});persist()}
  function removeDraft(draftId){requireOwner();state.invitationDrafts=state.invitationDrafts.filter(d=>!(d.workspaceId===state.activeWorkspaceId&&d.id===draftId));persist()}

/* Shared lifecycle used by future Mini Apps. A switch immediately clears the
   previous view, aborts requests, empties caches, and notifies every subscriber.
   Loaders must use load() to reject a stale response after a switch. */
const WorkspaceContext = (() => {
  let epoch=0,controller=new AbortController();
  const listeners=new Set(),cache=new Map();
  function switchTo(workspaceId,clear){
    if(!WorkspaceStore.list().some(w=>w.id===workspaceId))throw Error('This workspace is not available.');
    controller.abort();controller=new AbortController();epoch++;cache.clear();clear();
    WorkspaceStore.switchTo(workspaceId);
    const context=current();for(const fn of listeners)fn(context);return context;
  }
  function current(){return {workspaceId:WorkspaceStore.active().id,userId:WorkspaceStore.user.id,role:WorkspaceStore.role(),signal:controller.signal}}
  async function load(loader,commit){const version=epoch,context=current();try{const result=await loader(context);if(version!==epoch||context.signal.aborted)return false;commit(result,context);return true}catch(error){if(version!==epoch||context.signal.aborted)return false;throw error}}
  return Object.freeze({switchTo,current,load,subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)},cache});
})();
